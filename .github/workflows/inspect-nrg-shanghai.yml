name: Inspect Shanghai lobby identity
on:
  workflow_dispatch:
  push:
    branches: [codex/nrg-shanghai-data]
    paths:
      - data_prep/inspect_nrg_shanghai_match.py
      - .github/workflows/inspect-nrg-shanghai.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact lobby and account region
        env:
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
        run: python -u data_prep/inspect_nrg_shanghai_match.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanghai-match-audit
          path: shanghai-match-audit.json
          if-no-files-found: error
