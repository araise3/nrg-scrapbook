name: Update social feed

on:
  workflow_dispatch:

concurrency:
  group: update-social-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    # Development is on hold. Remove this guard only when the feed is resumed.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect free RSS and filter posts
        run: python data_prep/update_social_feed.py --report social-review.json
      - name: Save review report
        uses: actions/upload-artifact@v4
        with:
          name: social-review
          path: social-review.json
          retention-days: 7
      - name: Publish feed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/social_feed.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update social feed from public RSS"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
